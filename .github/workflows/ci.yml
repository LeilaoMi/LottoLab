name: Verify LottoLab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lottolab_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lottolab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Ephemeral CI service credentials, not deployment credentials.
      LOTTOLAB_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/lottolab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pip check
      - run: ruff check backend tests collector scripts migrations app.py
      - run: ruff format --check backend tests collector scripts migrations app.py
      - run: mypy backend
      - run: pytest -q --junitxml=.local/pytest-ci.xml
      - run: python scripts/check_postgres.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          include-hidden-files: true
          path: |
            .local/pytest-ci.xml
            .local/postgres-verification.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec prettier --check src e2e playwright.config.ts playwright.cloud.config.ts vite.config.ts
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm exec playwright test
        working-directory: frontend
      - run: pnpm exec playwright test --config playwright.cloud.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Create private disposable configuration
        run: python scripts/bootstrap_env.py
      - name: Build and start the final image
        run: docker compose -p lottolab-ci up -d --build --wait --wait-timeout 180
      - name: Verify API, worker and both synthetic datasets
        run: python scripts/check_container.py --seed-fixtures
      - name: Recreate containers while preserving their volumes
        run: |
          docker compose -p lottolab-ci down
          docker compose -p lottolab-ci up -d --wait --wait-timeout 120
      - name: Verify records, audit and completed result survived
        run: python scripts/check_container.py --after-restart
      - name: Verify preserved raw snapshot volume
        run: |
          docker compose -p lottolab-ci exec -T api python - <<'PY' > .local/container-raw-verification.json
          import hashlib
          import json
          from pathlib import Path
          files = list(Path('/data/raw').glob('*.snapshot'))
          assert len(files) >= 2, 'SSQ and DLT snapshots must survive container recreation'
          assert all(hashlib.sha256(file.read_bytes()).hexdigest() == file.stem for file in files)
          print(json.dumps({'status': 'PASS', 'snapshots': len(files)}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          include-hidden-files: true
          path: |
            .local/container-verification.json
            .local/container-raw-verification.json
      - name: Release only this runner's disposable containers and volumes
        if: always()
        run: docker compose -p lottolab-ci down --volumes --remove-orphans
