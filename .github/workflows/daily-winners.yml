# 每日刷新各彩种真实一等奖注数 + 销量 → prizes['winner_count_1'] + sales，让撞号/冷门度实测随最新数据更新。
# 主源 17500（data.17500.cn，GitHub runner 可达）；cwl/sporttery 为备源、境外可能不可达→优雅跳过。
# 依赖仓库 secret：DATABASE_URL（Neon 连接串）。
name: daily-winners
on:
  schedule:
    - cron: "40 15 * * *"     # 每日 15:40 UTC（北京 23:40，daily-sync 之后）
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Refresh real winner counts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collector/refresh_winners.py
      - name: Notice
        if: failure()
        run: echo "::warning::注数刷新失败，请检查 cwl/sporttery 可达性与 DATABASE_URL"
