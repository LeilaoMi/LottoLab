version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    backend-runtime:
      patterns:
      - '*'
  labels:
  - dependencies
  commit-message:
    prefix: build(deps)
  cooldown:
    default-days: 3
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  labels:
  - dependencies
  commit-message:
    prefix: build(deps)
  cooldown:
    default-days: 3
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  labels:
  - dependencies
  - ci
  commit-message:
    prefix: ci(deps)
  cooldown:
    default-days: 3
